{% extends "base.html" %}

{% block title %}{{ serverName }}{% endblock %}

{% block head %}
<style>
    .server-layout {
        display: flex;
        width: 100%;
        min-height: calc(100vh - 56px);
    }

    /* Server sidebar */
    .server-sidebar {
        width: 220px;
        flex-shrink: 0;

        background: #181818;
        border-right: 1px solid #333;

        padding: 15px 10px;
    }

    .server-name {
        padding: 10px;
        margin-bottom: 10px;

        font-size: 16px;
        font-weight: bold;

        color: #eee;
        border-bottom: 1px solid #333;
    }

    .server-nav {
        display: grid;
        gap: 5px;
    }

    .server-nav a {
        display: block;

        padding: 11px 12px;

        color: #bbb;
        text-decoration: none;

        border-radius: 5px;
        transition: background 0.15s, color 0.15s;
    }

    .server-nav a:hover {
        background: #292929;
        color: #fff;
    }

    .server-nav a.active {
        background: #333;
        color: #fff;
    }

    /* Main server content */
    .server-content {
        flex: 1;
        min-width: 0;
        padding: 20px;
    }
</style>
{% endblock %}

{% block content %}

<div class="server-layout">

    <aside class="server-sidebar">

        <div class="server-name">
            {{ serverName }}
        </div>

        <nav class="server-nav">

            <a href="/server/{{ serverName }}">
                Main
            </a>

            <a href="/server/{{ serverName }}/console">
                Console
            </a>

            <a href="/server/{{ serverName }}/filesystem">
                Filesystem
            </a>

            <a href="/server/{{ serverName }}/settings">
                Settings
            </a>

        </nav>

    </aside>

    <section class="server-content">
        {% block server_content %}
        {% endblock %}
    </section>

</div>

{% endblock %}
